<!-- #################### SHOW DISPLAY LANGUAGE ######################### -->
<div class="dropdown-content" id="dropdownContent">
    <div class="dropdown-content-inner">
        <div class="lang-option" onclick="selectLanguageAndClose('pl')">
            <img src="/images/flags/pl_flag.png" alt="Polski" class="flag-img">
            <span>Polski</span>
        </div>
        <div class="lang-option" onclick="selectLanguageAndClose('en')">
            <img src="/images/flags/en_flag.jpeg" alt="English" class="flag-img">
            <span>English</span>
        </div>
        <div class="lang-option" onclick="selectLanguageAndClose('ru')">
            <img src="/images/flags/ru_flag.jpg" alt="Русский" class="flag-img">
            <span>Русский</span>
        </div>
        <div class="lang-option" onclick="selectLanguageAndClose('ua')">
            <img src="/images/flags/uk_flag.png" alt="Українська" class="flag-img">
            <span>Українська</span>
        </div>
        <div class="lang-option" onclick="closeLangModal()">
            <span>Zamknij</span>
        </div>
    </div>
</div>
<!-- #################### SHOW DISPLAY LANGUAGE ######################### -->
